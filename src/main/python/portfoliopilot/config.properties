[MARKET_SETTINGS]
market_country = IN
run_mode = BACKTEST
total_budget = 100000.00
active_strategies = MOMENTUM, LONG_TERM
# GEMINI_AI_TREND / SENTIMENT_ROTATION are neutral in backtests (no point-in-time news data), so they are not listed.
active_analysts = QUANT_CORE_TREND, VALUATION_ALPHA
# API keys: set the GEMINI_API_KEY / OPENAI_API_KEY environment variables instead of writing keys in this file.

[BACKTEST_SETTINGS]
# Long window that includes the 2020 crash, the 2021 rally, the 2022 sideways market and 2023-2026.
start_date = 2018-01-01
end_date = 2026-10-31
# Develop / tune ONLY on data before split_date. Judge the result on the Out-of-Sample columns.
# Once you have looked at the out-of-sample numbers, do not keep tuning against them.
split_date = 2023-01-01
# Used for the Sharpe ratio (annual, e.g. 0.065 = 6.5% treasury-bill-like rate)
risk_free_rate = 0.065

[COST_SETTINGS]
# Assumed price impact per trade side in basis points (10 = 0.10%). Mid/small caps can be 30-100+ in practice.
slippage_bps = 10

[LARGE_CAP_TIER]
weight = 0.40
pool_size = 20
max_tickers = 3

[MID_CAP_TIER]
weight = 0.50
pool_size = 30
max_tickers = 4

[RISKY_TIER]
weight = 0.10
pool_size = 20
max_tickers = 1

[STRATEGY_TIMEFRAME_OVERRIDES]
swing_lookback_days = 15
swing_rebalance_days = 3
momentum_lookback_days = 15
momentum_rebalance_days = 10   # 10 trading days = bi-weekly
long_term_lookback_days = 30
long_term_rebalance_days = 15

[RISK_SETTINGS]
# After a fall of this size from the recent peak the strategy stops buying (existing stop-losses still apply).
max_drawdown_gate = 0.25
# The "recent peak" is measured over this many trading days (~6 months), so the gate can re-arm after recovery.
drawdown_window_days = 126
